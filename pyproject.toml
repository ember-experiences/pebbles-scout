[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pebbles-scout"
version = "0.1.0"
description = "Inbound research, watchlists, and candidate discovery — Tier 2 of the Pebbles family"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Agent Embers", email = "hello@agent-embers.ai"}
]
keywords = ["ai", "research", "discovery", "watchlists", "pebbles"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pebbles-core>=0.2.0",
    "click>=8.1.0",
    "feedparser>=6.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
supabase = [
    "supabase>=2.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.urls]
Homepage = "https://agent-embers.ai"
Repository = "https://github.com/ember-experiences/pebbles-scout"

[project.scripts]
pebbles-scout = "pebbles.scout.cli.main:scout_group"

# Also register as a Click subgroup under `pebbles` for installs that load
# pebbles-core's CLI plugin discovery (added in pebbles-core 0.2.1+).
# Until pebbles-core supports plugin discovery, the `pebbles-scout` script
# above is the documented entry point.
[project.entry-points."pebbles.subcommands"]
scout = "pebbles.scout.cli.main:scout_group"

[tool.setuptools.packages.find]
where = ["."]
include = ["pebbles.scout*"]
